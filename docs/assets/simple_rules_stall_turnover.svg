<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Simple stall and turnover rules</title>
  <desc id="desc">A simple diagram showing a marker near the thrower starting stall count, and common ways possession changes teams.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64706f"/>
    </marker>
  </defs>

  <rect width="960" height="430" fill="#f5f7f4"/>
  <text x="48" y="44" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#172126">Pressure Creates Turnovers</text>
  <text x="48" y="72" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64706f">A defender near the thrower starts the stall count. Other mistakes also give the disc away.</text>

  <g transform="translate(48 110)">
    <rect x="0" y="0" width="360" height="238" rx="9" fill="#ffffff" stroke="#cbd6d0" stroke-width="2"/>
    <text x="26" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#172126">Stall Count</text>
    <text x="26" y="62" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64706f">Counts only when the fixed marker is close.</text>
    <rect x="42" y="92" width="270" height="98" rx="8" fill="#dff5df" stroke="#cbd6d0" stroke-width="2"/>
    <circle cx="128" cy="142" r="24" fill="#1f6ed4" stroke="#d9e9ff" stroke-width="4"/>
    <text x="128" y="149" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">B1</text>
    <ellipse cx="164" cy="133" rx="13" ry="7" fill="#f4a62a" stroke="#9a5d0f" stroke-width="3"/>
    <circle cx="190" cy="142" r="22" fill="#d43f3a" stroke="#ffe0df" stroke-width="4"/>
    <text x="190" y="149" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">R1</text>
    <circle cx="128" cy="142" r="58" fill="none" stroke="#f3b51b" stroke-width="4" stroke-dasharray="12 8"/>
    <text x="220" y="125" font-family="Inter, Arial, sans-serif" font-size="12" fill="#704a00">within</text>
    <text x="220" y="141" font-family="Inter, Arial, sans-serif" font-size="12" fill="#704a00">marking</text>
    <text x="220" y="157" font-family="Inter, Arial, sans-serif" font-size="12" fill="#704a00">radius</text>
    <text x="180" y="216" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64706f" text-anchor="middle">stall 5 = turnover to marker</text>
  </g>

  <line x1="430" y1="230" x2="500" y2="230" stroke="#64706f" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(520 110)">
    <rect x="0" y="0" width="392" height="238" rx="9" fill="#ffffff" stroke="#cbd6d0" stroke-width="2"/>
    <text x="26" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#172126">Possession Changes</text>
    <text x="26" y="62" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64706f">After a turnover, the other team becomes offense.</text>

    <g transform="translate(28 86)">
      <rect x="0" y="0" width="156" height="44" rx="7" fill="#fff1ee" stroke="#d43f3a" stroke-width="2"/>
      <text x="78" y="28" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#9d2926" text-anchor="middle">blocked pass</text>

      <rect x="184" y="0" width="156" height="44" rx="7" fill="#fff1ee" stroke="#d43f3a" stroke-width="2"/>
      <text x="262" y="28" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#9d2926" text-anchor="middle">dropped catch</text>

      <rect x="0" y="64" width="156" height="44" rx="7" fill="#fff1ee" stroke="#d43f3a" stroke-width="2"/>
      <text x="78" y="92" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#9d2926" text-anchor="middle">out of bounds</text>

      <rect x="184" y="64" width="156" height="44" rx="7" fill="#fff1ee" stroke="#d43f3a" stroke-width="2"/>
      <text x="262" y="92" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#9d2926" text-anchor="middle">stall 5</text>
    </g>

    <text x="196" y="214" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64706f" text-anchor="middle">new thrower starts from the turnover spot or restart spot</text>
  </g>
</svg>
