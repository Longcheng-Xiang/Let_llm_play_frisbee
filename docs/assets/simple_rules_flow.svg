<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Simple frisbee possession and pass flow</title>
  <desc id="desc">A three step diagram showing a thrower holding the disc, choosing a receiver, and resolving a catch or turnover.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64706f"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#f5f7f4"/>
  <text x="48" y="44" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#172126">A Point Is A Chain Of Passes</text>
  <text x="48" y="72" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64706f">The disc holder cannot run. Teammates move to create a safe catch.</text>

  <g transform="translate(48 108)">
    <rect x="0" y="0" width="240" height="248" rx="9" fill="#ffffff" stroke="#cbd6d0" stroke-width="2"/>
    <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#172126">1. Hold</text>
    <text x="24" y="60" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64706f">Holder stops with the disc.</text>
    <rect x="34" y="95" width="172" height="92" rx="8" fill="#dff5df" stroke="#cbd6d0" stroke-width="2"/>
    <circle cx="84" cy="142" r="21" fill="#1f6ed4" stroke="#d9e9ff" stroke-width="4"/>
    <text x="84" y="148" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">B1</text>
    <ellipse cx="116" cy="136" rx="13" ry="7" fill="#f4a62a" stroke="#9a5d0f" stroke-width="3"/>
    <circle cx="158" cy="142" r="18" fill="#d43f3a" stroke="#ffe0df" stroke-width="4"/>
    <text x="158" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">R1</text>
    <text x="120" y="214" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64706f" text-anchor="middle">marker pressures stall</text>
  </g>

  <line x1="314" y1="232" x2="384" y2="232" stroke="#64706f" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(390 108)">
    <rect x="0" y="0" width="240" height="248" rx="9" fill="#ffffff" stroke="#cbd6d0" stroke-width="2"/>
    <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#172126">2. Lead</text>
    <text x="24" y="60" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64706f">Throw to where a teammate can arrive.</text>
    <rect x="34" y="95" width="172" height="92" rx="8" fill="#dff5df" stroke="#cbd6d0" stroke-width="2"/>
    <circle cx="72" cy="145" r="18" fill="#1f6ed4" stroke="#d9e9ff" stroke-width="4"/>
    <text x="72" y="151" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">B1</text>
    <circle cx="148" cy="126" r="18" fill="#1f6ed4" stroke="#d9e9ff" stroke-width="4"/>
    <text x="148" y="132" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">B3</text>
    <circle cx="164" cy="160" r="17" fill="#d43f3a" stroke="#ffe0df" stroke-width="4"/>
    <text x="164" y="166" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">R3</text>
    <path d="M 88 141 C 112 108 146 92 190 98" fill="none" stroke="#f4a62a" stroke-width="4" stroke-dasharray="11 8"/>
    <text x="120" y="214" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64706f" text-anchor="middle">avoid the defender's lane</text>
  </g>

  <line x1="656" y1="232" x2="726" y2="232" stroke="#64706f" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(732 108)">
    <rect x="0" y="0" width="180" height="248" rx="9" fill="#ffffff" stroke="#cbd6d0" stroke-width="2"/>
    <text x="22" y="34" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#172126">3. Resolve</text>
    <g transform="translate(22 74)">
      <rect x="0" y="0" width="136" height="52" rx="7" fill="#ecfbfa" stroke="#0f8f8c" stroke-width="2"/>
      <text x="68" y="22" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#075f66" text-anchor="middle">Catch</text>
      <text x="68" y="40" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64706f" text-anchor="middle">keep possession</text>

      <rect x="0" y="82" width="136" height="52" rx="7" fill="#fff1ee" stroke="#d43f3a" stroke-width="2"/>
      <text x="68" y="104" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#9d2926" text-anchor="middle">Block / Drop</text>
      <text x="68" y="122" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64706f" text-anchor="middle">turnover</text>
    </g>
  </g>
</svg>
